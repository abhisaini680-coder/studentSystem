<style>
  * {
    box-sizing: border-box;
  }

  .profile-container {
    padding: 30px 40px 40px 45px;

    background: #f5f7fb;

    min-height: calc(100vh - 69px);

    font-family:
      Arial,
      Helvetica,
      sans-serif;
  }

  /* ==========================================
     HEADER
     ========================================== */

  .page-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 25px;
  }

  .page-header h2 {
    margin: 0;

    color: #1f2937;

    font-size: 28px;
  }

  .edit-profile-btn {
    border: none;

    background: #2563eb;

    color: white;

    padding: 11px 20px;

    border-radius: 7px;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;
  }

  .edit-profile-btn:hover {
    background: #1d4ed8;
  }

  /* ==========================================
     PROFILE CARD
     ========================================== */

  .profile-card {
    max-width: 800px;

    background: white;

    padding: 30px;

    border-radius: 14px;

    box-shadow:
      0 3px 12px
      rgba(0, 0, 0, 0.08);
  }

  /* ==========================================
     PROFILE ROW
     ========================================== */

  .profile-row {
    display: grid;

    grid-template-columns:
      200px 1fr;

    gap: 20px;

    padding: 18px 0;

    border-bottom:
      1px solid #e5e7eb;
  }

  .profile-row:last-child {
    border-bottom: none;
  }

  .label {
    color: #374151;

    font-size: 15px;

    font-weight: 700;
  }

  .value {
    color: #64748b;

    font-size: 15px;
  }

  /* ==========================================
     EDIT INPUTS
     ========================================== */

  .edit-input {
    width: 100%;

    padding: 10px 12px;

    border:
      1px solid #d1d5db;

    border-radius: 7px;

    outline: none;

    font-size: 14px;
  }

  .edit-input:focus {
    border-color: #2563eb;

    box-shadow:
      0 0 0 3px
      rgba(37, 99, 235, 0.1);
  }

  /* ==========================================
     SAVE / CANCEL
     ========================================== */

  .action-buttons {
    display: flex;

    gap: 12px;

    margin-top: 25px;
  }

  .save-btn,
  .cancel-btn {
    border: none;

    padding: 11px 20px;

    border-radius: 7px;

    font-weight: 600;

    cursor: pointer;
  }

  .save-btn {
    background: #2563eb;

    color: white;
  }

  .save-btn:hover {
    background: #1d4ed8;
  }

  .cancel-btn {
    background: #6b7280;

    color: white;
  }

  .cancel-btn:hover {
    background: #4b5563;
  }

  /* ==========================================
     MESSAGES
     ========================================== */

  .success-message {
    margin-bottom: 20px;

    padding: 12px 15px;

    border-radius: 7px;

    background: #dcfce7;

    color: #15803d;

    font-size: 14px;

    font-weight: 600;
  }

  .error-message {
    margin-bottom: 20px;

    padding: 12px 15px;

    border-radius: 7px;

    background: #fee2e2;

    color: #dc2626;

    font-size: 14px;

    font-weight: 600;
  }

  /* ==========================================
     MOBILE
     ========================================== */

  @media (max-width: 700px) {

    .profile-container {
      padding: 20px;
    }

    .page-header {
      flex-direction: column;

      align-items: flex-start;

      gap: 15px;
    }

    .profile-card {
      padding: 20px;
    }

    .profile-row {
      grid-template-columns: 1fr;

      gap: 8px;
    }

    .action-buttons {
      flex-direction: column;
    }

    .save-btn,
    .cancel-btn {
      width: 100%;
    }
  }
</style>


<div class="profile-container">

  <!-- ==========================================
       PAGE HEADER
       ========================================== -->

  <div class="page-header">

    <h2>
      My Profile
    </h2>

    <button
      *ngIf="!editing"
      type="button"
      class="edit-profile-btn"
      (click)="startEditing()">

      Edit Profile

    </button>

  </div>


  <!-- ==========================================
       SUCCESS MESSAGE
       ========================================== -->

  <div
    *ngIf="message"
    class="success-message">

    {{ message }}

  </div>


  <!-- ==========================================
       ERROR MESSAGE
       ========================================== -->

  <div
    *ngIf="errorMessage"
    class="error-message">

    {{ errorMessage }}

  </div>


  <!-- ==========================================
       PROFILE CARD
       ========================================== -->

  <div class="profile-card">


    <!-- NAME -->

    <div class="profile-row">

      <div class="label">
        Name
      </div>

      <div class="value">

        <input
          *ngIf="editing"
          type="text"
          class="edit-input"
          [(ngModel)]="user.name"
          placeholder="Enter your name">

        <span *ngIf="!editing">
          {{ user.name || 'N/A' }}
        </span>

      </div>

    </div>


    <!-- EMAIL -->

    <div class="profile-row">

      <div class="label">
        Email
      </div>

      <div class="value">

        <input
          *ngIf="editing"
          type="email"
          class="edit-input"
          [(ngModel)]="user.email"
          placeholder="Enter your email">

        <span *ngIf="!editing">
          {{ user.email || 'N/A' }}
        </span>

      </div>

    </div>


    <!-- COURSE -->

    <div class="profile-row">

      <div class="label">
        Course
      </div>

      <div class="value">

        <input
          *ngIf="editing"
          type="text"
          class="edit-input"
          [(ngModel)]="user.course"
          placeholder="Enter your course">

        <span *ngIf="!editing">
          {{ user.course || 'N/A' }}
        </span>

      </div>

    </div>


    <!-- PHONE -->

    <div class="profile-row">

      <div class="label">
        Phone Number
      </div>

      <div class="value">

        <input
          *ngIf="editing"
          type="text"
          class="edit-input"
          [(ngModel)]="user.phone"
          placeholder="Enter phone number">

        <span *ngIf="!editing">
          {{ user.phone || 'N/A' }}
        </span>

      </div>

    </div>


    <!-- EDIT BUTTONS -->

    <div
      class="action-buttons"
      *ngIf="editing">

      <button
        type="button"
        class="save-btn"
        (click)="saveProfile()">

        Save Changes

      </button>


      <button
        type="button"
        class="cancel-btn"
        (click)="cancelEditing()">

        Cancel

      </button>

    </div>

  </div>

</div>
