<style>
  * {
    box-sizing: border-box;
  }

  .students-container {
    padding: 30px;
    background: #f5f7fb;
    min-height: calc(100vh - 65px);
    font-family: Arial, Helvetica, sans-serif;
  }

  /* Page Header */
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
  }

  .page-header h2 {
    margin: 0;
    color: #1f2937;
    font-size: 28px;
  }

  .total-students {
    background: #ffffff;
    padding: 12px 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    color: #374151;
    font-size: 15px;
  }

  .total-students strong {
    color: #2563eb;
    font-size: 18px;
  }

  /* Form Card */
  .form-card {
    background: #ffffff;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
  }

  .form-card h3 {
    margin: 0 0 20px;
    color: #1f2937;
    font-size: 20px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group label {
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: 600;
    color: #374151;
  }

  .form-group input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    outline: none;
    font-size: 14px;
    transition: 0.2s;
  }

  .form-group input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  /* Buttons */
  .form-buttons {
    display: flex;
    gap: 12px;
    margin-top: 22px;
  }

  .btn {
    border: none;
    padding: 11px 20px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }

  .save-btn {
    background: #2563eb;
    color: #ffffff;
  }

  .save-btn:hover {
    background: #1d4ed8;
  }

  .cancel-btn {
    background: #6b7280;
    color: #ffffff;
  }

  .cancel-btn:hover {
    background: #4b5563;
  }

  /* Table Card */
  .table-card {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }

  .table-title {
    padding: 20px 25px;
    border-bottom: 1px solid #e5e7eb;
  }

  .table-title h3 {
    margin: 0;
    color: #1f2937;
    font-size: 20px;
  }

  .table-wrapper {
    width: 100%;
    overflow-x: auto;
  }

  table {
    width: 100%;
    min-width: 850px;
    border-collapse: collapse;
  }

  thead {
    background: #1f3a5f;
  }

  thead th {
    color: #ffffff;
    padding: 15px;
    text-align: left;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }

  tbody td {
    padding: 15px;
    border-bottom: 1px solid #e5e7eb;
    color: #374151;
    font-size: 14px;
    vertical-align: middle;
  }

  tbody tr:hover {
    background: #f8fafc;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  /* ID */
  .id-cell {
    color: #2563eb;
    font-weight: 700;
  }

  /* Actions */
  .actions {
    display: flex;
    gap: 8px;
    white-space: nowrap;
  }

  .edit-btn,
  .delete-btn {
    border: none;
    padding: 7px 14px;
    border-radius: 6px;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }

  .edit-btn {
    background: #f59e0b;
  }

  .edit-btn:hover {
    background: #d97706;
  }

  .delete-btn {
    background: #dc2626;
  }

  .delete-btn:hover {
    background: #b91c1c;
  }

  /* Empty */
  .empty-row {
    text-align: center;
    padding: 35px !important;
    color: #6b7280 !important;
  }

  /* Responsive */
  @media (max-width: 700px) {

    .students-container {
      padding: 15px;
    }

    .page-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .form-grid {
      grid-template-columns: 1fr;
    }

    .form-buttons {
      flex-direction: column;
    }

    .btn {
      width: 100%;
    }
  }
</style>


<div class="students-container">

  <!-- PAGE HEADER -->
  <div class="page-header">

    <h2>Student Management</h2>

    <div class="total-students">
      Total Students:
      <strong>{{ students.length }}</strong>
    </div>

  </div>


  <!-- ADD / EDIT FORM -->
  <div class="form-card">

    <h3>
      {{ editing ? 'Edit Student' : 'Add New Student' }}
    </h3>

    <div class="form-grid">

      <!-- Name -->
      <div class="form-group">
        <label>Student Name</label>

        <input
          type="text"
          [(ngModel)]="student.name"
          placeholder="Enter student name">
      </div>


      <!-- Email -->
      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          [(ngModel)]="student.email"
          placeholder="Enter email">
      </div>


      <!-- Phone -->
      <div class="form-group">
        <label>Phone</label>

        <input
          type="text"
          [(ngModel)]="student.phone"
          placeholder="Enter phone">
      </div>


      <!-- Course -->
      <div class="form-group">
        <label>Course</label>

        <input
          type="text"
          [(ngModel)]="student.course"
          placeholder="Enter course">
      </div>

    </div>


    <!-- BUTTONS -->
    <div class="form-buttons">

      <button
        type="button"
        class="btn save-btn"
        (click)="saveStudent()">

        {{ editing ? 'Update Student' : 'Add Student' }}

      </button>


      <button
        type="button"
        class="btn cancel-btn"
        *ngIf="editing"
        (click)="clearForm()">

        Cancel

      </button>

    </div>

  </div>


  <!-- STUDENT TABLE -->
  <div class="table-card">

    <div class="table-title">
      <h3>Student List</h3>
    </div>


    <div class="table-wrapper">

      <table>

        <thead>

          <tr>
            <th>ID</th>
            <th>Student Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Course</th>
            <th>Actions</th>
          </tr>

        </thead>


        <tbody>

          <!-- STUDENT RECORDS -->
          <tr *ngFor="let item of students">

            <td class="id-cell">
              {{ item.id }}
            </td>

            <td>
              {{ item.name }}
            </td>

            <td>
              {{ item.email }}
            </td>

            <td>
              {{ item.phone }}
            </td>

            <td>
              {{ item.course }}
            </td>

            <td>

              <div class="actions">

                <button
                  type="button"
                  class="edit-btn"
                  (click)="editStudent(item)">

                  Edit

                </button>


                <button
                  type="button"
                  class="delete-btn"
                  (click)="deleteStudent(item.id)">

                  Delete

                </button>

              </div>

            </td>

          </tr>


          <!-- NO STUDENTS -->
          <tr *ngIf="students.length === 0">

            <td
              colspan="6"
              class="empty-row">

              No students found.

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
<p *ngIf="errorMessage">
  {{ errorMessage }}
</p>
