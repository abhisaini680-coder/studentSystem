<style>
  * {
    box-sizing: border-box;
  }

  .register-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    background: #f5f7fb;
    font-family: Arial, Helvetica, sans-serif;
  }

  .register-card {
    width: 100%;
    max-width: 650px;
    background: #ffffff;
    border-radius: 14px;
    padding: 35px 40px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
  }

  .register-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .register-header h2 {
    margin: 0 0 8px;
    color: #17365d;
    font-size: 30px;
  }

  .register-header p {
    margin: 0;
    color: #6b7280;
    font-size: 14px;
  }

  .success-message {
    margin-bottom: 20px;
    padding: 12px 15px;
    border-radius: 7px;
    background: #dcfce7;
    color: #15803d;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
  }

  .error-message {
    margin-bottom: 20px;
    padding: 12px 15px;
    border-radius: 7px;
    background: #fee2e2;
    color: #dc2626;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group label {
    margin-bottom: 7px;
    color: #374151;
    font-size: 14px;
    font-weight: 600;
  }

  .form-group input,
  .form-group select {
    width: 100%;
    padding: 12px 13px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    outline: none;
    background: #ffffff;
    color: #1f2937;
    font-size: 14px;
    font-family: inherit;
    transition: 0.2s;
  }

  .form-group input:focus,
  .form-group select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
  }

  .form-group input::placeholder {
    color: #9ca3af;
  }

  .form-group select:disabled {
    background: #f3f4f6;
    color: #9ca3af;
    cursor: not-allowed;
  }

  .course-loading {
    margin-top: 6px;
    color: #2563eb;
    font-size: 12px;
  }

  .no-course {
    margin-top: 6px;
    color: #dc2626;
    font-size: 12px;
  }

  .register-btn {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    border: none;
    border-radius: 7px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }

  .register-btn:hover {
    background: #1d4ed8;
  }

  .register-btn:disabled {
    background: #93c5fd;
    cursor: not-allowed;
  }

  .login-link {
    margin-top: 22px;
    text-align: center;
    color: #6b7280;
    font-size: 14px;
  }

  .login-link a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 700;
  }

  .login-link a:hover {
    text-decoration: underline;
  }

  @media (max-width: 600px) {
    .register-page {
      padding: 15px;
    }

    .register-card {
      padding: 25px 20px;
    }

    .form-grid {
      grid-template-columns: 1fr;
    }

    .register-header h2 {
      font-size: 26px;
    }
  }
</style>


<div class="register-page">

  <div class="register-card">

    <!-- HEADER -->
    <div class="register-header">

      <h2>
        Create Student Account
      </h2>

      <p>
        Enter your details to create your account
      </p>

    </div>


    <!-- SUCCESS MESSAGE -->
    <div
      *ngIf="message"
      class="success-message">

      {{ message }}

    </div>


    <!-- ERROR MESSAGE -->
    <div
      *ngIf="errorMessage"
      class="error-message">

      {{ errorMessage }}

    </div>


    <!-- FORM -->
    <div class="form-grid">


      <!-- NAME -->
      <div class="form-group">

        <label>
          Full Name
        </label>

        <input
          type="text"
          [(ngModel)]="name"
          placeholder="Enter your full name">

      </div>


      <!-- EMAIL -->
      <div class="form-group">

        <label>
          Email
        </label>

        <input
          type="email"
          [(ngModel)]="email"
          placeholder="Enter your email">

      </div>


      <!-- PHONE -->
      <div class="form-group">

        <label>
          Phone Number
        </label>

        <input
          type="tel"
          [(ngModel)]="phone"
          placeholder="Enter 10-digit phone number"
          maxlength="10">

      </div>


      <!-- COURSE -->
      <div class="form-group">

        <label>
          Course
        </label>

        <select
          [(ngModel)]="course"
          [disabled]="loadingCourses || courses.length === 0">

          <option
            value=""
            disabled>

            {{
              loadingCourses
                ? 'Loading courses...'
                : courses.length === 0
                  ? 'No courses available'
                  : 'Select your course'
            }}

          </option>


          <!-- ONLY COURSE NAME -->
          <option
            *ngFor="let item of courses"
            [value]="item.name">

            {{ item.name }}

          </option>

        </select>


        <div
          class="course-loading"
          *ngIf="loadingCourses">

          Loading courses from Admin...

        </div>


        <div
          class="no-course"
          *ngIf="!loadingCourses && courses.length === 0">

          No courses have been added by Admin yet.

        </div>

      </div>


      <!-- PASSWORD -->
      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          [(ngModel)]="password"
          placeholder="Enter password">

      </div>


      <!-- CONFIRM PASSWORD -->
      <div class="form-group">

        <label>
          Confirm Password
        </label>

        <input
          type="password"
          [(ngModel)]="confirmPassword"
          placeholder="Confirm password">

      </div>

    </div>


    <!-- REGISTER BUTTON -->
    <button
      type="button"
      class="register-btn"

      [disabled]="
        loading ||
        loadingCourses ||
        courses.length === 0
      "

      (click)="register()">

      {{
        loading
          ? 'Creating Account...'
          : 'Create Account'
      }}

    </button>


    <!-- LOGIN -->
    <div class="login-link">

      Already have an account?

      <a routerLink="/login">
        Login
      </a>

    </div>

  </div>

</div>
